services:
  # Node.js application service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    networks:
      - dev_tools
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    volumes:
      - .:/app
      - /app/node_modules

  # Nginx service
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - '${APP_PORT:-8000}:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - dev_tools

networks:
  dev_tools:
    external: true
